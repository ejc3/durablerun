# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Generated shape, hand-maintained content: every rule below points at a file
# in .github/review-bot-rules/, and scripts/review-bot-lint.py (run by
# `pnpm verify`) fails if this file and .greptile/config.json disagree with
# that directory. See .github/review-bot-rules/README.md for why these bots
# are a detection net and not a prevention.
language: en-US

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "DESIGN.md"
      - ".github/review-bot-rules/*.md"

reviews:
  profile: assertive
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
    # This project stacks pull requests (pr3.6 -> pr3.1 -> main), and auto
    # review is otherwise limited to the default branch, so every PR in a
    # stack but the last would be skipped.
    base_branches:
      - "main"
      - "pr.*"
  path_instructions:
    - path: "**/*"
      instructions: |
        Apply durablerun's custom review rules from `.github/review-bot-rules/` as they exist in the feature branch under review. A pull request can edit or remove these in-repo instructions, so they are a head-owned detection net rather than base-owned enforcement. This project's standing rules are in CLAUDE.md and its spec is DESIGN.md; a finding should name the MECHANISM that would have made the defect unwritable or machine-caught, not only the line to change — a fix without a prevention is not accepted here.
  pre_merge_checks:
    custom_checks:
      - name: "durablerun: checks-must-be-able-to-fail"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/checks-must-be-able-to-fail.md`. Flag a new or changed checker, guard, invariant, oracle, generated surface or probe mutation whose diff adds no input it must REJECT — a checker with one bad fixture where it claims several rules or matches an alternation (no per-rule, per-alternative `BAD_CASES` entry in scripts/lint-selftest.py, corruption case in invariant-checkers.test.ts, or `expect(() => …).toThrow` in fenced-batch.test.ts), a harvest that silently records nothing for input it cannot parse or a check that fails open on a nonzero exit, a pattern widened or tightened with no case the old one accepted, a mutation whose replacement changes binds or types instead of behaviour (counting binds after interpolation) or a diff that makes an existing `find` stale, an accept-only assertion, a rejection discarded by `.catch()`/`try{}catch{}` where every post-call assertion also holds when the call throws, an un-awaited `.rejects`, a two-condition guard one test satisfies either way, an invariant whose rows the same diff's statement erases, an oracle retyped as "structurally the same" instead of recovered from the shipped path, a generator holding one side of a correlation constant, or a knob that drives coverage to zero without refusing. Pass for code that merely CALLS an existing checker (`engineInvariantViolations(...)).toEqual([])` in the driver and conformance behaviour tests), differential oracles over generated surfaces (`disagreements(cases)).toEqual([])`), the accept half of a stated pair and `GOOD_CASES`, counter-examples kept beside a discriminating pin, fault-injection workloads that swallow every call because the oracle runs afterwards (`go()` in fault-matrix.ts), arrange-phase catches and preconditions, catches that record and are asserted, mutation replacements whose interpolated bind arity is unchanged, non-matching branches that fail closed, reasoned `EXEMPT`/`NOT_IN_GATE`/`TOKEN_FENCED`/`DYNAMIC`/`MATRIX_EXEMPT_LABELS` declarations, conditional skips with both branches fixtured, and the weak half of a stated two-part floor. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: dialect-portability"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/dialect-portability.md`. Flag dialect-only SQL or backend-behaviour assumptions added above the store layer (packages/{core,sdk,driver,harness,conformance}/src — `||` concat, instr, typeof, `x IS NOT y`, clock calls, upsert/RETURNING/FOR UPDATE, NULL-orderable sorts, rowsAffected-decided winners), cross-dialect constants defined inside a store-* package instead of core/contract.ts, checkers that match SQL case-sensitively or with one dialect's vocabulary or glob packages/store-libsql instead of packages/store-*, a per-dialect spelling entering DESIGN.md §3.4 or specs/*.tla without the required property stated and checked for all three dialects, conformance code that branches/skips on a dialect or puts a shared-schema §3.4 scenario in a single-dialect test file instead of conformance/src/suite.ts, and new protocol facts recorded only in TypeScript. Pass for store-* eligibility fragments and DDL state lists (fragments.ts, schema.ts — mandated by §3.4 and fragment-lint), case-sensitive matching against repo-generated tokens ($NOW$, $STAMP$, fence_stamp), sorts already guarded IS NOT NULL or built from a non-nullable CASE, portable SQL skeletons and shared-schema raw SQL in core and the conformance suite (FencedBatch.derived, suite.ts, fault-matrix.ts), dialect SQL inside packages/store-*, a dialect named in prose as rationale for a stricter portable check, port contracts that name and normalize divergence, bin/ composition roots and test/ per-dialect fixtures and store-internal tests, pre-existing debt in a touched file (report once, not per line), and facts already deferred under BUILD.md's PR4.1. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: docs-track-behaviour"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/docs-track-behaviour.md`. Flag behaviour changes (batch guards, port signatures/error types, schema, retry arithmetic, wire forms) with no DESIGN.md hunk anywhere in the branch diff where a specific spec sentence can be quoted as falsified or missing, comments the diff makes false or orphans, comments asserting two sites are the same while the diff spells them separately (two different shared fragments still counts) with no drift test, exact counts of this repo's own artifacts (tests, guards, checkers, findings, gate membership) contradicted by the same PR or by another count of the same set, added postmortems whose narrative rate or attributions disagree with their detection ledger, and deferrals that never land as a sub-bullet under a live BUILD.md PR entry. Pass for spec/DESIGN edits landing in another commit of the same branch, fixes that make code obey a rule DESIGN.md already states, test-only diffs and oracles that deliberately restate a rule, past-tense history naming the mechanism that now holds, DESIGN.md narrating its own drafts, measured DBMS facts with sample sizes, approximate or ranged counts ("200+", "9–11"), category-level gate summaries still true, numbers inside earlier rounds' postmortems, unannotated deferral sub-bullets under live PR entries, `ABANDONED:` notes and prose about deferral under DONE entries, "deferral" as engine vocabulary (§3.8.2 dispatch deferral, deferred start), and refactors preserving every statement's semantics. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: fence-gates-every-write"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/fence-gates-every-write.md`. Flag a non-CAS statement that can write rows it did not prove this batch produced: no top-level `fence_stamp = fence(...)` conjunct, a fence past a top-level OR or under NOT, a hand-written UPDATE/DELETE `followOn` where `derived()` should generate the selection, a follow-on keyed on post-state a duplicate delivery leaves identical (or on the pre-condition the CAS consumed), a stamp-fenced INSERT with no ownership replay guard (or a diff deleting one), a `derived()` `key`/`column` pair naming different identifier kinds, a follow-on selecting from a table the batch never wrote (or a condition added to `wake-runs`'s `IN` driver without its `EXISTS` witness), a value or identifier read from a row no fence of this batch gates, a stamp used as proof of authorship, a multi-statement `db.batch` write with no structural fence of its own, or caller text spliced unbracketed into a boolean position in `fenced-batch.ts`. Pass for `openTail` reads fenced on a lease token or unique index (`picked`, `receipt`, `hit`), CAS guards over unwritten tables and CAS counter bumps, `fragments.ts`'s ownership predicates, `checkpointWrite`'s attempt tiebreak, shrink-only `narrow:` clauses (including the `f` alias inside their own subqueries), bracketed ORs from `cancelNotDue`/`eligibleTask` and inside a `derived()` `where:`, post-state in a `derived()` `where:`, generated provenance on `derived()` updates, `wake-runs` itself, `heartbeat`/`expireLeaseNow`/`driverHeartbeat`, read-mode batches, and `admin.ts`'s sentinel-fenced migration batches. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: guard-needs-an-executable-twin"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/guard-needs-an-executable-twin.md`. Flag a store batch implementing a ledger-mapped action whose protocol cap (`attempts+1 < MaxAttempts`, `infraRetries < InfraRetryCap`, `relaunchCount = RelaunchCap`) is in neither its SQL nor `invariants.ts`; a spec guard or `TypeOK` bound added with no enforcement anywhere; a twin retired (a `[cas-fenced]` tag downgraded, an action dropped or naming a definition the spec lacks, `spec-ledger.py` narrowed, a `fenceTwin` marker over an `it()` with no refusal assertion of any form); a checker weakened (conjunct dropped, LEFT→inner join, NULL-safe `IS`→`<>` on a nullable column) or added without its constructed-corruption case; a statement erasing the only rows a checker could name by a class wider than the rows it wrote; or a hand-written `waits` write predicate omitting a field an invariant ties together, including a split index driver carrying a condition its witness lacks. Pass for artificial model bounds (`MaxHops`, `nextRun <= MaxRuns`, the `ASSUME`), spec-first actions modeled ahead of implementation, implementation guards strictly narrower than a documented model gap, equivalent cap spellings, generated follow-ons and `openTail` reads keyed on rows the batch stamped or with a recorded reason, `[read]`/`[setup]`/`[receipt]` labels, refusals proven by state rather than exception, plain comparison on NOT NULL columns, documented accounting bands, the deliberately redundant one-witness condition, waits-table predicates the model excludes, and conjuncts kept unreachable by a typed boundary. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: mechanism-not-point-fix"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/mechanism-not-point-fix.md`. Flag a correctness fix that defends only the instance with no mechanism at any rung (no type/structure change, no lint, no generated case or axis, no invariant, no class-altitude test file, no TLA guard, and no BUILD.md sub-bullet under a live entry naming the missing one), a prevention that is only prose (a comment asserting two sites agree with nothing enforcing it, a comment naming a mechanism that resolves to nothing in the tree, a CLAUDE.md or pr-gate line as the diff's sole response to a defect), a text-deciding check whose same diff claims the runtime property ("unwritable", "inexpressible", "by construction", "rung 1") without exhibiting a false negative, a new guard/invariant/surface with no attack at all (no MUTATIONS entry, rejection test, BAD_CASES entry, constructed corruption, or differential control) including a mutation that changes bind arity or a surface varying only one side of a correlation, a positive plan pin over SQL hand-copied from src, or an added postmortem whose Mechanism-audit table skips a mechanism the diff adds. Pass for text bans whose subject is the text (clock-lint, determinism-lint, fragment-lint, batch-lint, the executor's error-string classifier), checks that state their own residual and where it is closed (hasPositiveFence, gate-lint, review-bot-lint), guards attacked by rejection tests rather than probe mutations, full observable-state differentials whose invariant-clean mutation changes a trace or protocol table (clock-jitter), deliberate counter-example or differently-shaped second representations (query-plans' degraded shape, the wake-witness oracle), pr-gate case-law prose, deferrals under live BUILD.md entries with reasons, mechanisms measured unsound and rejected with the measurement, extensions of an existing class layer, refuted claims kept as guard tests, and diffs with no defect behind them or defects the author's own machinery caught. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: no-one-shot-flags"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/no-one-shot-flags.md`. Flag a transition admitted by a flag it also sets (`SET started_at_ms = now … WHERE started_at_ms IS NULL`, `WHERE activated_gen = 0`, a new `0/1`/`…_done`/`active` column or nullable timestamp on runs/tasks/waits read as `IS NULL`/`= 0` to permit a re-enterable transition); an ordinal (`claim_gen`, `activated_gen`, `attempt`, `owner_attempt`, `relaunch_count`, `infra_retries`) guarded with `<>`/`!=` or against a literal instead of the monotone `activated_gen < :claim_gen`; an ordinal reset to `0`/`NULL` or written from a `COUNT(*)` over deletable rows; a new re-entry path whose transition keeps a quoted flag guard; an in-process per-occurrence value matched on a repeating key (event name not step key, `runId` not `(runId, claimGen)`) or never consumed, or a never-reset field/"seen" set on an object outliving the occurrence; a TLA action for a re-entrant transition guarded on a boolean rather than an ordinal; and a new generation CAS shipped with no conformance case where a SECOND occurrence PASSES it plus an invariant bounding the ordinal. Pass for nullable timestamps read as DUE times paired with a clock comparison (`available_at_ms IS NOT NULL AND <= now`, `cancelDue`), once-ever FACTS that gate nothing (`started_at_ms`/`first_started_at_ms` COALESCE beside `activated_gen < :claim_gen`), CAS guards on the re-enterable pre-state (`state = 'running'`, `relaunch_count < RELAUNCH_CAP`), column-to-column ordinal comparisons that classify sweep arms (`activated_gen = claim_gen`, `activated_gen < claim_gen`), existence tests on a per-occurrence token or minted identity (claim's `NOT EXISTS … claimed_by = ?`, spawn's two `NOT EXISTS`, `successorOwned` keyed by task and intended attempt), once-per-KEY lifecycles (`emitEvent` first-write-wins, `awaitEvent`'s `NOT EXISTS events`, the `applied:vN` sentinel with its previous-value-guarded bump), latches scoped to one occurrence and rebuilt per claim (`pendingWake`/`takeWake`, finally-reset `inStep`, `seen`/`nameUses`, per-pass AbortControllers, `FencedBatch`'s local `won`), single-use objects that throw (`DriverLoop.everRan`), conformance checkers and hand-seeded fixture rows, TLA one-shots the model documents (`firstStarted`, `eventState`), and the PR3.8 wait-identity deferral BUILD.md already owns. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: one-instant-per-batch"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/one-instant-per-batch.md`. Flag a second database-clock read inside one batch — a raw wall-clock function, a re-spelled `NOW_MS`, or a `fake_now_ms` read in a package `clock-lint` does not walk (any casing) or in a new basename-exempt `time.ts`; `${NOW_MS}`/`${NOW}`/an alias/a clock-carrying fragment appearing in two statements of one `this.db.batch` or `FencedBatch` (including when hoisted into a constant, which `batch-lint` counts as zero); database time in any non-CAS statement; a hand-stamped follow-on whose `fence_at_ms` is not a stamped row's `fence_at_ms`; a first-write-wins conflict restamp that names a table or instant absent from the dialect-neutral preserved-instant enumeration; an engine instant computed in TypeScript and bound as `?`; CAS arms made mutually exclusive by a clock comparison; a non-statement-stable dialect clock (`SYSDATE()`, `clock_timestamp()`); a second clock definition beside `NOW_MS`; or a weakening of clock-lint/batch-lint/the FencedBatch clock guard/its mutation-probe entry/lint-selftest's spelling list/`one-batch-two-instants`/the clock-jitter test. Pass for any number of reads within ONE statement however aliased, mutually exclusive CAS arms that each read it, `sweep:scan`'s declared read-only pair, arithmetic on `fence_at_ms` via `fencedAt`, an instant copied from any column an earlier statement of the batch wrote, a follow-on's instant read off a different table the batch stamped, a stored protocol instant from an earlier transition used for its contract meaning, including the enumerated `events.emitted_at_ms` conflict restamp, `time.ts` and the `admin:*` doors, deliberate test clocks and lint-selftest fixtures, and a `requireEpochMs`-validated `atEpochMs` bound as `?`. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: red-test-before-fix"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/red-test-before-fix.md`. Flag a repair whose regression test and fix share one commit, whose test lands with no preceding test-only commit, whose observed failure is not stated, or whose test survives reverting the fix — the swallowed call whose rejection the fix changes followed only by assertions a throw also satisfies, an existence-only assertion as the whole test, a fixture that reaches a pre-existing conflict clause before the new guard, one case for a two-conjunct guard or a generated surface varying one side of the correlation, a plan/text pin on SQL re-typed into the test while the shipped statement is exported or recoverable — plus any assertion deleted/loosened/skipped or pinned seed, id/token sequence or fake-now value moved in the fix's own commit, a deleted mutation-probe entry, a broadened checker with no new lint-selftest bad fixture, an "untestable" claim with no seam, and an added postmortem whose Evidence names no red test for the findings fixed here. Pass for red+green pairs, fixes that strengthen or correct their own red test, new capability and construction-time red, existence assertions used as anti-vacuity preconditions, `.catch()` where the rejection is not the property under test, raw fixture SQL and deliberate negative controls, mutations re-aimed rather than deleted, mechanical test refactors, injected values corrected because a new oracle rejected them, checker fixes carrying their bad fixture, and comment-only source edits. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: single-representation"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/single-representation.md`. Flag a second copy of something that already has a definition — a query plan EXPLAINed against SQL typed into the test instead of the imported or executor-recorded shipped statement, a copy justified by "structurally the same"/"mirrors"/"kept in sync" with nothing in the diff that fails on divergence, a contract constant or fragment or attempt-ordinal formula respelled (even arithmetically equivalently) where a single definition is importable, a hand-maintained list of labels/checkers/columns/placeholders with no reconciliation against its source, one value handed to two sinks raw on one path and validated-or-canonical on the other, a routine libSQL fixture constructing or ignoring a second `IdSource` instead of sharing `openTestDb().ids`, and two branches applying different conditions to the same column set. Pass for negative controls asserting the degraded plan, deliberately independent oracles (wake-witness-surface, conformance invariants), copies that report their own staleness (mutation-probe MUTATIONS), classification lists whose harvest is total (fault-matrix MATRIX_*, batch-lint READS/TOKEN_FENCED, gate-lint NOT_IN_GATE, lint-selftest EXEMPT), per-dialect SQL and schema.ts DDL, raw fixture SQL that reads or builds engine state in tests, deliberately colliding or scripted `IdSource`s when the collision or sequence is the assertion, contract literals asserted (not constructed) in the conformance suite, error messages echoing raw user input, and per-query row decoders. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
      - name: "durablerun: test-determinism"
        mode: error
        instructions: |
          Fail when the diff introduces or materially widens any failure shape in `.github/review-bot-rules/test-determinism.md`. Flag test-side nondeterminism: a real sleep standing between an action and an assertion about another actor when an observable predicate was available, an engine deadline (lease, backoff, start deadline, wait timeout) crossed by real elapsed time instead of `admin.setFakeNowEpochMs`/the fixture's `advance()`, an assertion whose subject is measured wall time, an assertion that PREDICTS an id/token minted from ambient entropy or from an `Rng` seeded by anything but a literal or loop index, a fuzz/matrix seed-or-step count from `process.env` without the positive-integer `knob()` guard or removal of a progress floor, a numeric literal port bound or handed to a spawned host, a tmp path not built by `mkdtempSync`, and state one `it` writes that a DIFFERENT `it` reads. Pass for deadline-bounded `until()` polls, real-timer yields that reach quiescence before a virtual-clock advance, settle sleeps for OS/socket facts with no observable predicate, wall-clock assertions whose subject is the real-time fallback, a real timer that IS the test's subject (starvation probes, determinism-contract negatives), `systemIdSource()` in the real-process hosts and chaos legs where ids are opaque handles, `new Rng(seed)`/`seededIdSource(new Rng(seed))` in fixture helpers taking seed as a parameter, `Date.now()` used only for timeout bookkeeping, a fixed db basename inside a `mkdtempSync` directory, a port captured from `listen()` and rebound, a module-level cleanup registry read only by `afterAll`, module bindings re-created in `beforeEach`, and floors relocated from per-walk to per-shard aggregate. Pass for the cases listed in that file Allowed section, for test-only scaffolding that does not make production behaviour worse, and for existing debt the diff does not worsen.
