\* The protocol with the await ALLOWED: a parent, a child in the parent's
\* queue, and one retry-task revival of the child.
CONSTANTS
  MaxRetries = 1
  AwaitAllowed = TRUE
  AtomicEmit = TRUE
  UserMayForge = FALSE
  LegacyEnd = TRUE
  LegacyEndWhileWaiting = FALSE

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  TerminalImpliesDone
  DoneIsFirstOutcome
  WaitIntegrity
  WaitIsWakeable
  ParkedMatchesEvent
  SeenIsFirstOutcome
  RefusedNeverWaits
  RefusalIsTheRule

PROPERTY
  DoneImmutable
  DoneAuthority
  SpawnAuthority
  AnswerIsFinal
  WakeIsDelivered
  EveryWaitResolves

\* Every final state is legitimate: a parent may never await its child.
CHECK_DEADLOCK FALSE
