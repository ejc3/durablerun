\* The protocol with the await ALLOWED, the larger behaviour: a parent, a child in
\* the same queue, and one retry-task revival of the child.
CONSTANTS
  MaxRetries = 1
  AwaitAllowed = TRUE
  AtomicEmit = TRUE
  UserMayForge = FALSE

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  TerminalImpliesDone
  DoneIsFirstOutcome
  WaitIntegrity
  ParkedMatchesEvent
  SeenIsFirstOutcome
  RefusedNeverWaits

PROPERTY
  DoneImmutable
  DoneAuthority
  EveryWaitResolves

\* Every final state is legitimate: a parent may never await its child.
CHECK_DEADLOCK FALSE
