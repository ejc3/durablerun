\* Vacuity probe, EXPECTED TO FAIL: a revived child ends again with another outcome and the event keeps the first.
CONSTANTS
  MaxRetries = 1
  SameQueue = TRUE
  SameQueueRule = "allow"
  AtomicEmit = TRUE
  UserMayForge = FALSE
SPECIFICATION Spec
INVARIANT ProbeNoSecondOutcome
CHECK_DEADLOCK FALSE
