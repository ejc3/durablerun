\* LIVENESS group 4/5 at a reduced horizon. Why the temporal properties are
\* split into groups: the scripts/tla.sh header. Scheduler.cfg checks safety
\* exhaustively at the larger constants.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 3
  MaxAttempts = 2
  InfraRetryCap = 1
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

\* SpecFair = Init /\ [][Next]_vars /\ weak fairness on
\* TimeAdvance/Claim/Deliver/Sweep/CancelSweep -- needed for the liveness
\* properties.  Safety-only runs can use SPECIFICATION Spec instead.
SPECIFICATION SpecFair



\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE

PROPERTY
  EveryWaitResolves

