\* CI-sized configuration (PR gate on 4-core runners): the invariants and
\* every temporal property in one TLC process. The pool-sizing ASSUME
\* (MaxRuns >= MaxAttempts + InfraRetryCap) holds with InfraRetryCap 0, so the
\* infra-successor chain is exercised only by the deeper scopes (Scheduler.cfg
\* and SchedulerLiveness1-5.cfg).
CONSTANTS
  Tasks = {t1}
  MaxRuns = 2
  MaxTime = 3
  MaxAttempts = 2
  InfraRetryCap = 0
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

\* SpecFair = Init /\ [][Next]_vars /\ weak fairness on
\* TimeAdvance/Claim/Deliver/Sweep/CancelSweep -- needed for the liveness
\* properties.  Safety-only runs can use SPECIFICATION Spec instead.
SPECIFICATION SpecFair

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent
  ClaimReplayBound

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  EventImmutable
  EmitAuthority
  PayloadAuthority
  EventuallyTerminal
  EveryWaitResolves
  WakeupDelivered

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
