\* As Sagas.cfg, with a rolling-back task refusing cancellation.
CONSTANTS
  Steps = {"a", "b", "c"}
  Registered = {"a", "b"}
  MaxRollbackAttempts = 2
  MaxRevivals = 1
  CancelMidRollback = "refused"
  ReviveAfterSaga = "refused"
  InfraCapRollsBack = TRUE
  AtomicEnter = TRUE
  MarkerFirst = TRUE

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  RollbackBudgetHeld
  RevivalBoundHeld
  StartOrderDistinct
  RollbackOnlyEligible
  ReverseOrder
  SagaOnlyAfterDecision
  OutcomeHonest
  FailedOutcomeHonest
  OutcomeOnlyWhenTerminal
  FailedImpliesSettled
  CancelledSagaIsSurfaced
  MemoMatchesEffect
  RefusedCancelNeverHalts
  RefusedRevivalNeverRestarts
  InfraSkipNeverRollsBack
  DoneMeansCompensated

PROPERTY
  StartOrderImmutable
  ForwardFrozenInSaga
  RollbackIsFinal
  TriesOnlyGrow
  OutcomeIsFinal
  DecisionIsMadeOnce
  CompensatesAnEffect
  SagaEndsFailed
  TerminalIsQuiet
  FailedMovesOnlyByRevival
  RevivalOnlyOfFailed
  DecisionSettles

\* Every final state is legitimate: a task may complete, fail, or be cancelled.
CHECK_DEADLOCK FALSE
