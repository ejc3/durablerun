\* TLC configuration for Scheduler.tla (absurd-lite scheduler protocol,
\* incl. cancellation + the event protocol): exhaustive SAFETY at the
\* largest constants. The 3-row run pool is 1 initial + 1 user-retry
\* successor + 1 infra successor.
\* CONSTANTS TRADEOFF: a second event or task multiplies the state space
\* several-fold.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 4
  MaxAttempts = 2
  MaxRetries = 0
  InfraRetryCap = 1
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 2
  Events = {e1}

\* SAFETY ONLY at these constants: the liveness graph at this size is
\* ~57M states and OOMs any reasonable heap. Liveness (all PROPERTYs,
\* SpecFair) runs at the reduced horizon in SchedulerLiveness1-5.cfg --
\* exhaustive safety at the big bound, liveness at the tractable one.
SPECIFICATION Spec

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent
  ClaimReplayBound
  StartLatchMeansDispatched


\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
