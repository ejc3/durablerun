\* TLC configuration for Scheduler.tla (absurd-lite scheduler protocol,
\* incl. cancellation + the PR3.1 event protocol).  Sized for exhaustive
\* checking: 1 task, 3-row run pool (= 1 initial + 1 user-retry successor +
\* 1 infra successor), time horizon 4, lease 2, one event, both
\* cancellation policies at length 2.
\* CONSTANTS TRADEOFF: one event and one task keep the full run (safety +
\* 4 liveness properties) in single-digit minutes; a second event or task
\* multiplies the space several-fold -- for those, prefer SPECIFICATION
\* Spec (safety only) and drop the liveness PROPERTYs.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 4
  MaxAttempts = 2
  InfraRetryCap = 1
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 2
  Events = {e1}

\* SAFETY ONLY at these constants: the liveness graph at this size is
\* ~57M states and OOMs any reasonable heap. Liveness (all PROPERTYs,
\* SpecFair) runs at the reduced horizon in SchedulerLiveness.cfg --
\* exhaustive safety at the big bound, liveness at the tractable one.
SPECIFICATION Spec

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent


\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
