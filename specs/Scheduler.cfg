\* TLC configuration for Scheduler.tla (absurd-lite scheduler protocol).
\* Sized for exhaustive checking: 1 task, 3-row run pool (= 1 initial +
\* 1 user-retry successor + 1 infra successor), time horizon 4, lease 2.
\* Two-task variant: Tasks = {t1, t2}, MaxRuns = 6 -- then prefer
\* SPECIFICATION Spec (safety only) and drop EventuallyTerminal for speed.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 4
  MaxAttempts = 2
  InfraRetryCap = 1
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1

\* SpecFair = Init /\ [][Next]_vars /\ weak fairness on
\* TimeAdvance/Claim/Deliver/Sweep -- needed for EventuallyTerminal.
\* Safety-only runs can use SPECIFICATION Spec instead.
SPECIFICATION SpecFair

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  EventuallyTerminal

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
