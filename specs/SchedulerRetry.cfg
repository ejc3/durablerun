\* retryTask scope: one revival (MaxRetries 1) checked for every invariant, the
\* action properties (TerminalStability's single exception, the payload
\* channel, and SuccessorCarriesWake included), and EventuallyTerminal.
\* MaxAttempts 1 and InfraRetryCap 0 keep each task to two runs: the initial run
\* and its revival, whose one extra attempt is the revival run itself, so its
\* failure is terminal. The CI and full scopes keep MaxRetries 0; their constants
\* and cost are unchanged.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 2
  MaxTime = 3
  MaxAttempts = 1
  MaxRetries = 1
  InfraRetryCap = 0
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent
  ClaimReplayBound
  StartLatchMeansDispatched
  AccountingBand
  LiveRunIsNextAccounted
  FailedChargeWithinBudget

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  PayloadAuthority
  SuccessorCarriesWake
  EventuallyTerminal

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
