\* retryTask scope: one revival (MaxRetries 1) checked for every invariant, the
\* action properties (TerminalStability's single exception included), and
\* EventuallyTerminal. MaxAttempts 1 and InfraRetryCap 0 keep the pool at three
\* runs, the initial run, its revival, and the retry successor the revival's
\* extra budget allows, so the state space stays near the CI scope's. The CI
\* and full scopes keep MaxRetries 0; their constants and cost are unchanged.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 3
  MaxAttempts = 1
  MaxRetries = 1
  InfraRetryCap = 0
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent
  ClaimReplayBound
  StartLatchMeansDispatched
  AccountingBand
  LiveRunIsNextAccounted
  FailedChargeWithinBudget

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  PayloadAuthority
  SuccessorCarriesWake
  EventuallyTerminal

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
