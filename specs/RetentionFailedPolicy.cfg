\* A spawning parent in the child's queue, with a policy that purges failed
\* tasks and keeps cancelled ones: a failed parent is purged before its child,
\* and a cancelled holder keeps what it carries.  The liveness property earns its
\* keep here, where the policy keeps one state and not another.
CONSTANTS
  ParentQueue = "same"
  Policy = {"completed", "failed"}
  Window = 1
  MaxRetries = 1
  HandleWithinWindow = TRUE
  LegacyEndWhileWaiting = FALSE
  Lift = {}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  WholeUnit
  ReplayableParentKeepsChild
  NoStrandedWaiter
  CarrierKeepsEvent

PROPERTY
  PurgeOnlyDeadAndOld
  RevivalSeesWholeUnit
  AwaitOnPurgedIsRefused
  AgedUnblockedIsPurged

\* Every final state is legitimate: a unit the policy keeps is kept forever.
CHECK_DEADLOCK FALSE
