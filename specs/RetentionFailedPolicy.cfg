\* A spawning parent in the child's queue, with a policy that purges every
\* terminal state, failed tasks included: a failed parent is purged before its
\* child, and a failed holder's runs go with its unit.  The policy type names
\* completed and cancelled windows always and a failed one optionally, so this
\* and Retention.cfg's policy are the two it can express.
CONSTANTS
  ParentQueue = "same"
  Policy = {"completed", "cancelled", "failed"}
  Window = 1
  MaxRetries = 1
  HandleWithinWindow = TRUE
  LegacyEndWhileWaiting = FALSE
  Lift = {}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  WholeUnit
  ReplayableParentKeepsChild
  NoStrandedWaiter
  CarrierKeepsEvent
  NameCarrierKeepsChild

PROPERTY
  PurgeOnlyDeadAndOld
  RevivalSeesWholeUnit
  AwaitOnPurgedIsRefused
  AgedUnblockedIsPurged

\* Every final state is legitimate: a unit the policy keeps is kept forever.
CHECK_DEADLOCK FALSE
