\* LIVENESS configuration: reduced horizon (MaxTime 3, CancelLen 1) so the
\* temporal graph stays tractable; Scheduler.cfg checks safety exhaustively
\* at the full constants.  Sized for exhaustive
\* checking: 1 task, 3-row run pool (= 1 initial + 1 user-retry successor +
\* 1 infra successor), time horizon 4, lease 2, one event, both
\* cancellation policies at length 2.
\* CONSTANTS TRADEOFF: one event and one task keep the full run (safety +
\* 4 liveness properties) in single-digit minutes; a second event or task
\* multiplies the space several-fold -- for those, prefer SPECIFICATION
\* Spec (safety only) and drop the liveness PROPERTYs.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 3
  MaxAttempts = 2
  InfraRetryCap = 1
  RelaunchCap = 1
  MaxHops = 1
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

\* SpecFair = Init /\ [][Next]_vars /\ weak fairness on
\* TimeAdvance/Claim/Deliver/Sweep/CancelSweep -- needed for the liveness
\* properties.  Safety-only runs can use SPECIFICATION Spec instead.
SPECIFICATION SpecFair

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  EventImmutable
  EmitAuthority
  PayloadAuthority
  EventuallyTerminal
  EveryWaitResolves
  WakeupDelivered

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
