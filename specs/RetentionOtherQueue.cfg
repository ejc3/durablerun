\* A spawning parent in another queue: its await of the child is refused, and
\* the barrier must still find it.
CONSTANTS
  ParentQueue = "other"
  Policy = {"completed", "cancelled"}
  Window = 1
  MaxRetries = 1
  HandleWithinWindow = TRUE
  LegacyEndWhileWaiting = FALSE
  Lift = {}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  WholeUnit
  ReplayableParentKeepsChild
  NoStrandedWaiter
  CarrierKeepsEvent

PROPERTY
  PurgeOnlyDeadAndOld
  RevivalSeesWholeUnit
  AwaitOnPurgedIsRefused
  AgedUnblockedIsPurged

\* Every final state is legitimate: a unit the policy keeps is kept forever.
CHECK_DEADLOCK FALSE
