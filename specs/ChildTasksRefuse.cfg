\* The protocol with the await REFUSED: a parent, a child in another
\* queue, and one retry-task revival of the child.
CONSTANTS
  MaxRetries = 1
  AwaitAllowed = FALSE
  AtomicEmit = TRUE
  UserMayForge = FALSE
  LegacyEnd = TRUE
  LegacyEndWhileWaiting = FALSE

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  TerminalImpliesDone
  DoneIsFirstOutcome
  WaitIntegrity
  WaitIsWakeable
  ParkedMatchesEvent
  SeenIsFirstOutcome
  RefusedNeverWaits
  RefusalIsTheRule

PROPERTY
  DoneImmutable
  DoneAuthority
  AnswerIsFinal
  WakeIsDelivered
  EveryWaitResolves

\* Every final state is legitimate: a parent may never await its child.
CHECK_DEADLOCK FALSE
