\* The protocol with the same-queue await REFUSED, as DESIGN.md has it today: a
\* parent and a child in one queue, and one retry-task revival of the child.
CONSTANTS
  MaxRetries = 1
  SameQueue = TRUE
  SameQueueRule = "refuse"
  AtomicEmit = TRUE
  UserMayForge = FALSE

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  TerminalImpliesDone
  DoneIsFirstOutcome
  WaitIntegrity
  ParkedMatchesEvent
  ResolvedSawFirstOutcome
  RefusedRegistersNothing
  RefusalIsTheRule

PROPERTY
  DoneImmutable
  DoneAuthority
  EveryWaitResolves

\* Every final state is legitimate: a parent may never await its child.
CHECK_DEADLOCK FALSE
