\* A child with no spawning parent, enqueued under a producer's key.  Every
\* terminal state is purged, and both assumptions this model can drop are
\* dropped: a third party may await after the child's unit went, and an older
\* build may end the child under a registered wait.
CONSTANTS
  ParentQueue = "none"
  Policy = {"completed", "cancelled", "failed"}
  Window = 1
  MaxRetries = 1
  HandleWithinWindow = FALSE
  LegacyEndWhileWaiting = TRUE
  Lift = {}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  WholeUnit
  ReplayableParentKeepsChild
  NoStrandedWaiter
  CarrierKeepsEvent

PROPERTY
  PurgeOnlyDeadAndOld
  RevivalSeesWholeUnit
  AwaitOnPurgedIsRefused
  AgedUnblockedIsPurged

\* Every final state is legitimate: a unit the policy keeps is kept forever.
CHECK_DEADLOCK FALSE
