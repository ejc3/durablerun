\* retryTask infrastructure scope: one revival (MaxRetries 1) at InfraRetryCap 1,
\* so RetryTask runs after infrastructure retries and the charge's infraRetries
\* term is checked. SchedulerRetry.cfg keeps InfraRetryCap 0 and liveness; this
\* scope is safety only, with no hops and no relaunches, which keeps it small.
CONSTANTS
  Tasks = {t1}
  MaxRuns = 3
  MaxTime = 3
  MaxAttempts = 1
  MaxRetries = 1
  InfraRetryCap = 1
  RelaunchCap = 0
  MaxHops = 0
  LeaseLen = 2
  SleepDur = 1
  Backoff = 1
  CancelLen = 1
  Events = {e1}

SPECIFICATION Spec

INVARIANT
  TypeOK
  NoDualActivation
  NoDualFencedWriter
  SingleActiveRunPerTask
  TerminalTaskQuiescent
  WaitIntegrity
  PayloadMatchesEvent
  ClaimReplayBound
  StartLatchMeansDispatched
  AccountingBand
  LiveRunIsNextAccounted
  FailedChargeWithinBudget

PROPERTY
  TerminalStability
  AttemptAccounting
  LeaseAuthority
  PayloadAuthority
  SuccessorCarriesWake

\* Terminal quiescence (all tasks done, clock at horizon, channel drained)
\* is a legitimate final state, not an error.
CHECK_DEADLOCK FALSE
