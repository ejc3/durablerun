\* A spawning parent in the child's queue.  The policy purges completed and
\* cancelled tasks and keeps failed ones, the default.
CONSTANTS
  ParentQueue = "same"
  Policy = {"completed", "cancelled"}
  Window = 1
  MaxRetries = 1
  HandleWithinWindow = TRUE
  LegacyEndWhileWaiting = FALSE
  Lift = {}

SPECIFICATION SpecFair

INVARIANT
  TypeOK
  WholeUnit
  ReplayableParentKeepsChild
  NoStrandedWaiter
  CarrierKeepsEvent
  NameCarrierKeepsChild

PROPERTY
  PurgeOnlyDeadAndOld
  RevivalSeesWholeUnit
  AwaitOnPurgedIsRefused
  AgedUnblockedIsPurged

\* Every final state is legitimate: a unit the policy keeps is kept forever.
CHECK_DEADLOCK FALSE
