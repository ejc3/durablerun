# Principle: everything runnable locally is runnable here, identically —
# `pnpm verify` is the same gate in both places. As phases land, this file
# grows the same way the local story does: seeded sim-fuzz jobs, MySQL and
# Postgres service containers (Phase 4), and TLC model checking of
# specs/*.tla (PR1.7) — all deterministic, all reproducible from a checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # 16 to 30 minutes across recent runs. At least three times the slowest, the margin the per-test limits have, with
    # room for the suite to grow: a slow runner must not cancel a required check, and a hung run must not hold a runner
    # for the six hour default. A limit is not latency. The arithmetic is in BUILD.md, where the limit was first set.
    timeout-minutes: 120
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
      # The dialects this job has servers for. MySQL runs the same suite in its
      # own job below, beside this one, so this job stays the length it was.
      DURABLERUN_CONFORMANCE_DIALECTS: libsql,postgres
      # What the service below is created with. A PostgreSQL test holds the server to it, so
      # an image that stopped honouring the arguments cannot pass for a linguistic server.
      DURABLERUN_POSTGRES_LOCALE_PROVIDER: icu
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          # This image's C library sorts text by its bytes whatever locale the database
          # names, so a statement that orders by the database's collation cannot fail
          # here. ICU gives the service a linguistic collation, as a managed server may
          # have, and the suite then sees what that server would show.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The identical conformance suite against MySQL 8, in parallel with `verify`.
  # The server is started by hand because a service container takes no server
  # arguments: the data directory is a tmpfs and the binary log and durable
  # flushes are off, which is what keeps a database for every test affordable.
  conformance-mysql:
    runs-on: ubuntu-latest
    # Six to eleven minutes across recent runs, and at least three times the slowest, like verify.
    timeout-minutes: 45
    env:
      DURABLERUN_MYSQL_URL: mysql://root:durablerun@127.0.0.1:3306/durablerun
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL 8
        run: |
          docker run -d --name durablerun-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=durablerun -e MYSQL_DATABASE=durablerun \
            --tmpfs /var/lib/mysql:rw,size=4g mysql:8.4 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 --sync-binlog=0 --max-connections=500
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MySQL to accept queries
        run: |
          for attempt in $(seq 1 60); do
            if docker exec durablerun-mysql mysql -h127.0.0.1 -uroot -pdurablerun -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs durablerun-mysql | tail -40
          exit 1
      - run: bash packages/conformance/bin/dialect-conformance.sh mysql

  # The mutation audit runs each mutation's registered test, so a full run fits in
  # a CI job and no one has to run it by hand before merging.
  mutations:
    runs-on: ubuntu-latest
    # 16 to 30 minutes across recent runs, and at least three times the slowest, like verify.
    timeout-minutes: 120
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
      # Some registered mutations are killed by tests that need a MySQL server.
      DURABLERUN_MYSQL_URL: mysql://root:durablerun@127.0.0.1:3306/durablerun
      # What the PostgreSQL service below is created with, as in the verify job.
      DURABLERUN_POSTGRES_LOCALE_PROVIDER: icu
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          # A linguistic collation, for the reason the verify job's service gives.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MySQL 8 and wait for it to accept queries
        run: |
          docker run -d --name durablerun-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=durablerun -e MYSQL_DATABASE=durablerun \
            --tmpfs /var/lib/mysql:rw,size=4g mysql:8.4 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 --sync-binlog=0 --max-connections=500
          for attempt in $(seq 1 60); do
            if docker exec durablerun-mysql mysql -h127.0.0.1 -uroot -pdurablerun -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs durablerun-mysql | tail -40
          exit 1
      - run: pnpm verify:mutations

  tla:
    runs-on: ubuntu-latest
    # About five minutes when healthy. A hung TLC run must not hold a runner for the six hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Model-check the scheduler protocol (CI scope)
        run: TLA_SCOPE=ci bash scripts/tla.sh

  # The gate cannot be allowed to grade itself.
  #
  # `verify` above runs from the pull request's own checkout, and the list of
  # checks it runs is a string in that same tree's package.json. Deleting
  # `&& pnpm lint:clock` from it is therefore green by construction — the
  # branch under review decides what reviews it. Every checker has the same
  # shape: its rules live in the tree it grades. So this job runs the BASE
  # branch's copies against the pull request's tree.
  #
  # Two limits, both found by this job's own first live run:
  #
  # 1. Older checkers derive their root from __file__ and ignore a supplied
  #    root argument. The runner therefore stages the head tree in a temporary
  #    directory and replaces its scripts/ directory with the base branch's
  #    whole scripts/ directory. Base-owned code then resolves __file__ inside
  #    the head-shaped tree. Its command inventory comes semantically from the
  #    base package.json, includes both Python and shell checks, and must be
  #    nonempty. Once the base owns this runner, its copy executes too; the
  #    head copy is an explicit one-release bootstrap for a base that predates
  #    gate-lint.py.
  # 2. This workflow file comes from the pull request head, like everything
  #    else. The threat model is CLAUDE.md's — "forgot under momentum", not a
  #    determined edit — and against that a copy the branch did not write is
  #    the defence. It is not a sandbox.
  base-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Three to six minutes across recent runs. Its longest step is main's registry self-test over the head tree.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit beside it
        run: git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
      - name: The base gate's composition rules, applied to this tree
        run: |
          set -euo pipefail
          if [ ! -f /tmp/base/scripts/gate-lint.py ]; then
            echo "The base branch predates gate-lint.py, so there is no earlier"
            echo "composition to compare this one against. True only until this merges."
            exit 0
          fi
          python3 /tmp/base/scripts/gate-lint.py "$GITHUB_WORKSPACE" /tmp/base
      - name: Expose installed modules to staged base-owned checkers
        env:
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          mkdir -p "$TMPDIR"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$TMPDIR/node_modules"
      - name: Bridge a new dialect package past its older base checker
        # The head gate above owns an entirely new package. The older ledger
        # cannot classify a dialect that did not exist on its branch. Each
        # becomes a no-op automatically as soon as its PR is the base.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          added_root="$RUNNER_TEMP/durablerun-base-added"
          for package in store-postgres store-mysql; do
            if git ls-tree -r --name-only "$BASE_SHA" -- "packages/$package" | grep -q .; then
              continue
            fi
            mkdir -p "$added_root"
            mv -- "packages/$package" "$added_root/$package"
          done
      - name: Bridge pinned file pairs past their older base copies
        # The base's checkers run against this tree from a staged copy of the base. When
        # a checker or its data must change in the same pull request as the code it
        # reads, the base copy cannot pass, and the reviewed exception is one row here:
        # a path, the sha256 of the base's file, and the sha256 of this tree's file,
        # which is installed over it. A base whose file has another hash skips the row,
        # and so does a tree that leaves the file as the base has it. A tree that
        # changes the file to anything but the pinned head file is refused, so a later
        # edit to that file must re-pin it in the same reviewed change. A row is dead
        # once its pull request is the base, and is deleted then. No row is live.
        run: |
          python3 - <<'PY'
          import hashlib
          import tempfile
          from pathlib import Path
          PAIRS = (
              # (path, sha256 of the base's file, sha256 of this tree's file, why)
          )
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def bridge(pairs, base_root, head_root):
              installed = []
              for path, base_hash, head_hash, why in pairs:
                  base = base_root / path
                  if not base.exists() or sha(base.read_bytes()) != base_hash:
                      print(f'{path}: the base does not need this pair.')
                      continue
                  candidate = (head_root / path).read_bytes()
                  if candidate == base.read_bytes():
                      print(f'{path}: this tree leaves the file as the base has it.')
                      continue
                  if sha(candidate) != head_hash:
                      raise SystemExit(f'{path}: the pair is pinned to one head file; re-pin it with the change to that file.')
                  base.write_bytes(candidate)
                  installed.append(path)
                  print(f'{path}: installed the pinned head file over the pinned base file ({why}).')
              return installed
          bridge(PAIRS, Path('/tmp/base'), Path('.'))
          print(f'{len(PAIRS)} pinned file pairs.')
          # A live row runs one of the table's four answers, so these controls run all four on
          # every pull request: another base skips, a head that leaves the file alone skips, an
          # unpinned head refuses, a pinned one installs.
          with tempfile.TemporaryDirectory() as scratch:
              base_root, head_root = Path(scratch) / 'base', Path(scratch) / 'head'
              base_root.mkdir()
              head_root.mkdir()
              (base_root / 'f').write_bytes(b'old')
              (head_root / 'f').write_bytes(b'new')
              if bridge((('f', sha(b'another base'), sha(b'new'), 'control'),), base_root, head_root) or (base_root / 'f').read_bytes() != b'old':
                  raise SystemExit('pinned pairs control: a base with another hash was not skipped.')
              (head_root / 'f').write_bytes(b'old')
              if bridge((('f', sha(b'old'), sha(b'a head nobody reviewed'), 'control'),), base_root, head_root) or (base_root / 'f').read_bytes() != b'old':
                  raise SystemExit('pinned pairs control: a head that leaves the file as the base has it was not skipped.')
              (head_root / 'f').write_bytes(b'new')
              refused = False
              try:
                  bridge((('f', sha(b'old'), sha(b'a head nobody reviewed'), 'control'),), base_root, head_root)
              except SystemExit:
                  refused = True
              if not refused or (base_root / 'f').read_bytes() != b'old':
                  raise SystemExit('pinned pairs control: a head file other than the pinned one was not refused.')
              if bridge((('f', sha(b'old'), sha(b'new'), 'control'),), base_root, head_root) != ['f'] or (base_root / 'f').read_bytes() != b'new':
                  raise SystemExit('pinned pairs control: the pinned head file was not installed.')
          print('pinned pairs controls: skipped twice, refused, and installed as pinned.')
          PY
      - name: Bridge the older base registry to this tree
        # A base registry's find strings must occur in this tree, and every verdict
        # marker in this tree's tests must be registered or exempted by it. Some
        # find strings were legitimately re-aimed, and some markers are newer than
        # a base. The one arm is pinned to the base registry's hash and replaces or
        # adds only that data, never checker logic or verdicts. Any other base skips.
        # An arm is dead once its pull request is the base, and the next pull request
        # that needs one replaces it. The step holds only the helpers its arm calls. A
        # helper that re-aims or retires a base entry comes back with the arm that
        # needs it, from this file's history, so the required step runs no dead code.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path('/tmp/base/scripts/mutation-probe.py')
          previous = base.read_text()
          candidate = Path('scripts/mutation-probe.py').read_text()
          digest = hashlib.sha256(previous.encode()).hexdigest()
          def exempt(repaired, candidate, markers):
              # Exempt verdict markers this tree registers and the base registry predates.
              table = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(table) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              for marker in markers:
                  if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                      raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              entries = ''.join(
                  f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n'
                  for marker in markers
              )
              return repaired.replace(table, table + entries)
          if digest == 'e4b71d2e7cf20f7a95ceb2fd9ab59d9f7dd6a6826888124f39d473db5fc56615':
              # PostgreSQL's schema gained a version that declares the byte collation on
              # every text column, and a server test reads the catalog to hold it: no text
              # column or index key keeps its database's collation, and no migration
              # rewrites a table. A second server test holds that a second migrator waits
              # for the first and never deadlocks with it, and a third that a read batch
              # which loses a deadlock is run again. Their mutations are newer than the
              # base registry, so their verdict markers are exempted there. No base entry
              # is re-aimed.
              repaired = exempt(previous, candidate, (
                  "mutation-verdict:behavior:postgres-text-column-keeps-database-collation",
                  "mutation-verdict:behavior:postgres-collation-migration-rewrites-a-table",
                  "mutation-verdict:behavior:postgres-migrator-locks-meta-before-its-sentinel",
                  "mutation-verdict:behavior:postgres-deadlocked-read-runs-again",
                  "mutation-verdict:behavior:postgres-index-key-keeps-another-collation",
              ))
          else:
              print('Base registry does not need the re-aim bridge.')
              raise SystemExit(0)
          base.write_text(repaired)
          print('Bridged the base registry as its arm says; all other base registry bytes are unchanged.')
          PY
      - name: The base branch's checkers, applied to this tree
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          if [ -f /tmp/base/scripts/gate-lint.py ] && grep -q -- '--run-base HEAD BASE' /tmp/base/scripts/gate-lint.py; then
            python3 /tmp/base/scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          else
            python3 scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          fi
