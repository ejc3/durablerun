# Principle: everything runnable locally is runnable here, identically —
# `pnpm verify` is the same gate in both places. As phases land, this file
# grows the same way the local story does: seeded sim-fuzz jobs, MySQL and
# Postgres service containers (Phase 4), and TLC model checking of
# specs/*.tla (PR1.7) — all deterministic, all reproducible from a checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The mutation audit runs each mutation's registered test, so a full run fits in
  # a CI job and no one has to run it by hand before merging.
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:mutations

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Model-check the scheduler protocol (CI scope)
        run: TLA_SCOPE=ci bash scripts/tla.sh

  # The gate cannot be allowed to grade itself.
  #
  # `verify` above runs from the pull request's own checkout, and the list of
  # checks it runs is a string in that same tree's package.json. Deleting
  # `&& pnpm lint:clock` from it is therefore green by construction — the
  # branch under review decides what reviews it. Every checker has the same
  # shape: its rules live in the tree it grades. So this job runs the BASE
  # branch's copies against the pull request's tree.
  #
  # Two limits, both found by this job's own first live run:
  #
  # 1. Older checkers derive their root from __file__ and ignore a supplied
  #    root argument. The runner therefore stages the head tree in a temporary
  #    directory and replaces its scripts/ directory with the base branch's
  #    whole scripts/ directory. Base-owned code then resolves __file__ inside
  #    the head-shaped tree. Its command inventory comes semantically from the
  #    base package.json, includes both Python and shell checks, and must be
  #    nonempty. Once the base owns this runner, its copy executes too; the
  #    head copy is an explicit one-release bootstrap for a base that predates
  #    gate-lint.py.
  # 2. This workflow file comes from the pull request head, like everything
  #    else. The threat model is CLAUDE.md's — "forgot under momentum", not a
  #    determined edit — and against that a copy the branch did not write is
  #    the defence. It is not a sandbox.
  base-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit beside it
        run: git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
      - name: The base gate's composition rules, applied to this tree
        run: |
          set -euo pipefail
          if [ ! -f /tmp/base/scripts/gate-lint.py ]; then
            echo "The base branch predates gate-lint.py, so there is no earlier"
            echo "composition to compare this one against. True only until this merges."
            exit 0
          fi
          python3 /tmp/base/scripts/gate-lint.py "$GITHUB_WORKSPACE" /tmp/base
      - name: Expose installed modules to staged base-owned checkers
        env:
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          mkdir -p "$TMPDIR"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$TMPDIR/node_modules"
      - name: Bridge the new PostgreSQL package past its older base checker
        # The head gate above owns this entirely new package. The older ledger
        # cannot classify a dialect that did not exist on its branch. This
        # becomes a no-op automatically as soon as this PR is the base.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only "$BASE_SHA" -- packages/store-postgres | grep -q .; then
            exit 0
          fi
          added_root="$RUNNER_TEMP/durablerun-base-added"
          mkdir -p "$added_root"
          mv -- packages/store-postgres "$added_root/store-postgres"
      - name: Bootstrap staged dependency installation for the older base runner
        # Only the known pre-install runner needs this one-release bridge.
        # Preserve every byte outside the reviewed install insertion; checker
        # inventory, sources, and the canonical BASE invocation remain unchanged.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path('/tmp/base/scripts/gate-lint.py')
          previous = base.read_text()
          if hashlib.sha256(previous.encode()).hexdigest() != 'bcb9983eb2d17e8b68a832feef08d21f056d8f708a5f143c164440ad62ad55bf':
              print('Base runner does not need the staged-install bootstrap.')
              raise SystemExit(0)
          candidate = Path('scripts/gate-lint.py').read_text()
          marker = '        # The staged checkout needs its own tools and workspace links.\n'
          anchor = '        ran = 0\n'
          if candidate.count(marker) != 1 or candidate.count(anchor) != 1 or previous.count(anchor) != 1:
              raise SystemExit('Staged-install bootstrap requires unique insertion boundaries.')
          insertion = candidate[candidate.index(marker):candidate.index(anchor)]
          repaired = previous.replace(anchor, insertion + anchor)
          if not insertion or repaired != candidate:
              raise SystemExit('Staged-install bootstrap may only add the dependency prerequisite.')
          base.write_text(repaired)
          print('Applied the staged-install prerequisite; all other BASE runner bytes are unchanged.')
          PY
      - name: Bridge fixed release data in the older base package checkers
        # Only these exact alpha.0 checkers need the one-release bridge.
        # Replace release data, never checker logic, inventory, or assertions.
        # The next base reads source version data itself and skips this step.
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          version = json.loads(Path('packages/core/package.json').read_text()).get('version')
          number = r'(?:0|[1-9][0-9]*)'
          identifier = rf'(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern = rf'{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          if not isinstance(version, str) or re.fullmatch(pattern, version) is None:
              raise SystemExit('Release bridge requires an exact source core release version.')
          for name, expected_hash, expected_count in (
              ('package-smoke-manifest.mjs', '52c858788371b4b57f5e9cbfb8e157652a2264cb2eb6a7bb96bded767e515666', 2),
              ('package-smoke-manifest-selftest.mjs', '0d7636485d70f18ab14df79e2ff602b7d3a298326a036ebf481c80c3a154a357', 1),
          ):
              base = Path('/tmp/base/scripts') / name
              previous = base.read_bytes()
              if hashlib.sha256(previous).hexdigest() != expected_hash:
                  print(f'{name}: base does not need the fixed-release bridge.')
                  continue
              old = b"'0.1.0-alpha.0'"
              if previous.count(old) != expected_count:
                  raise SystemExit(f'{name}: release literal count changed.')
              base.write_bytes(previous.replace(old, f"'{version}'".encode()))
              print(f'{name}: updated {expected_count} release literals; all other base bytes unchanged.')
          PY
      - name: Bridge the new read labels past the older base batch lint
        # This tree adds two read batches, claimed-task-name and refusal-state.
        # The base batch lint predates them and cannot classify them. The arm is
        # pinned to one base lint hash and adds only those READS entries, and only
        # when this tree's own batch lint declares exactly them as new reads. Any
        # other base skips.
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          base = Path('/tmp/base/scripts/batch-lint.py')
          previous = base.read_text()
          if hashlib.sha256(previous.encode()).hexdigest() != 'e1804459e87714adc61db0250f36c0cb1c8127b0d018d685c99f33e90ea8e3c2':
              print('Base batch lint does not need the read-label bridge.')
              raise SystemExit(0)
          def reads(text):
              match = re.search(r'^READS = \{\n(.*?)^\}', text, re.M | re.S)
              if match is None:
                  raise SystemExit('read-label bridge requires one READS table.')
              return set(re.findall(r'"([^"]+)"', match.group(1)))
          labels = ('claimed-task-name', 'refusal-state')
          added = reads(Path('scripts/batch-lint.py').read_text()) - reads(previous)
          if added != set(labels):
              raise SystemExit(f'read-label bridge covers exactly {labels}; this tree adds {sorted(added)}.')
          anchor = 'READS = {\n'
          if previous.count(anchor) != 1:
              raise SystemExit('read-label bridge requires one READS anchor.')
          base.write_text(previous.replace(anchor, anchor + ''.join(f'    "{label}",\n' for label in labels)))
          print('Added two read labels to the base batch lint; all other base bytes are unchanged.')
          PY
      - name: Bridge re-aimed mutation targets in the older base registry
        # A base registry's find strings must occur in this tree, and every verdict
        # marker in this tree's tests must be registered or exempted by it. Some
        # find strings were legitimately re-aimed, and some markers are newer than
        # a base. Each arm is pinned to one base registry hash and replaces or adds
        # only that data, never checker logic or verdicts. Any other base skips.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path('/tmp/base/scripts/mutation-probe.py')
          previous = base.read_text()
          candidate = Path('scripts/mutation-probe.py').read_text()
          digest = hashlib.sha256(previous.encode()).hexdigest()
          def entry(text, name):
              key = f'            "{name}",\n'
              if text.count(key) != 1:
                  raise SystemExit(f'{name}: the re-aim bridge requires exactly one spec entry.')
              start = text.rindex('        (\n', 0, text.index(key))
              end = text.index('        ),\n', start) + len('        ),\n')
              return start, end
          if digest == '0ee074470a4315d43f41d6e6947b72a43512dd0b1a423951487d28ffbf0d0dd8':
              # Three SDK guard specs were re-aimed against this registry.
              repaired = previous
              for name in (
                  'sdk-context-captured-json-parse',
                  'sdk-owned-event-timeout-discriminant',
                  'sdk-owned-event-payload-discriminant',
              ):
                  start, end = entry(repaired, name)
                  new_start, new_end = entry(candidate, name)
                  old_entry = repaired[start:end]
                  new_entry = candidate[new_start:new_end]
                  if old_entry.splitlines()[:3] != new_entry.splitlines()[:3]:
                      raise SystemExit(f'{name}: the re-aim bridge may change only find, replacement, and description.')
                  repaired = repaired[:start] + new_entry + repaired[end:]
          elif digest == '0bb4f12a043a7642f096799306d9a526ee0f9dd3baddf9b243e911d4327d4a73':
              # The spawn cancellation deadline addition was re-aimed against this registry.
              case = '        "spawn-cancellation",\n'
              old = '        "         CASE WHEN ? IS NOT NULL THEN ${NOW} + ? + ? ELSE NULL END,\\n",\n'
              new = '        "         ${NOW} + ? + ?,\\n",\n'
              for text, line, count in ((previous, old, 1), (candidate, new, 1), (candidate, old, 0)):
                  if text.count(line) != count:
                      raise SystemExit('spawn-cancellation: the re-aim bridge requires one old and one new addition text.')
              for text, line in ((previous, old), (candidate, new)):
                  at = text.index(line)
                  if case not in text[text.rindex('    (\n', 0, at):at]:
                      raise SystemExit('spawn-cancellation: the re-aimed addition text must belong to its case.')
              repaired = previous.replace(old, new)
              # Two verdict markers this tree registers are unknown to this registry.
              exemptions = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(exemptions) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              markers = (
                  'mutation-verdict:behavior:successor-carries-every-column',
                  'mutation-verdict:behavior:task-result-accepts-engine-outcomes',
              )
              for marker in markers:
                  if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                      raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              entries = ''.join(
                  f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n'
                  for marker in markers
              )
              repaired = repaired.replace(exemptions, exemptions + entries)
          elif digest == '21afc73785b502980482196a44fb618b732911058784e30ab4c035e70269fe2d':
              # Removing reschedule's 'preserve' disposition re-aimed three finds, and
              # one verdict marker this tree registers is unknown to this registry.
              def block(text, key):
                  if text.count(key) != 1:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge requires exactly one entry.')
                  start = text.rindex('    (\n', 0, text.index(key))
                  end = text.index('    ),\n', start) + len('    ),\n')
                  return start, end
              repaired = previous
              for key in (
                  '        "reschedule-wake-own-discriminant",\n        "packages/store-libsql/src/store.ts",\n',
                  '        "reschedule-wake",\n        "reschedule wake deadline",\n',
                  '        "suspend-wake",\n        "suspend wake deadline",\n',
              ):
                  start, end = block(repaired, key)
                  new_start, new_end = block(candidate, key)
                  repaired = repaired[:start] + candidate[new_start:new_end] + repaired[end:]
              exemptions = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(exemptions) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              marker = 'mutation-verdict:behavior:claimed-task-name-requires-queue'
              if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                  raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              repaired = repaired.replace(
                  exemptions,
                  exemptions + f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n',
              )
          elif digest == '205e8666661bfefeaf65c5ce620314f0542cce95f4dce867c34318268e6a0845':
              # Eight verdict markers this tree registers for retryTask are unknown to
              # this registry. Nothing it quotes was re-aimed.
              repaired = previous
              exemptions = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(exemptions) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              markers = (
                  'mutation-verdict:behavior:retry-task-charges-net-of-infra-retries',
                  'mutation-verdict:behavior:retry-task-charges-unaccounted-top-run',
                  'mutation-verdict:behavior:retry-task-requires-accounting-band',
                  'mutation-verdict:behavior:retry-task-requires-charge-within-budget',
                  'mutation-verdict:behavior:retry-task-requires-counters-in-range',
                  'mutation-verdict:behavior:retry-task-requires-failed-task',
                  'mutation-verdict:behavior:retry-task-requires-incrementable-budget',
                  'mutation-verdict:behavior:retry-task-requires-well-formed-failure',
              )
              for marker in markers:
                  if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                      raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              entries = ''.join(
                  f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n'
                  for marker in markers
              )
              repaired = repaired.replace(exemptions, exemptions + entries)
          elif digest == 'd72b80282762dd41b7f2a6acc495250a7fb9f38a52180bc99fa7e0bc8ac68839':
              # Naming the cancellation on a refused heartbeat re-aimed three finds,
              # removed one guard whose code path no longer exists, and registered five
              # verdict markers this registry predates.
              def spec_block(text, key, opener, closer):
                  if text.count(key) != 1:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge requires exactly one entry.')
                  start = text.rindex(opener, 0, text.index(key))
                  end = text.index(closer, start) + len(closer)
                  return start, end
              repaired = previous
              for key, opener, closer in (
                  ('        "sdk-owned-retry-attempt",\n', '    (\n', '    ),\n'),
                  ('        "sdk-malformed-checkpoint-stops-pump",\n', '    (\n', '    ),\n'),
                  ('            "task-control-runtime-lease-auth",\n', '        (\n', '        ),\n'),
              ):
                  start, end = spec_block(repaired, key, opener, closer)
                  new_start, new_end = spec_block(candidate, key, opener, closer)
                  if repaired[start:end].splitlines()[:3] != candidate[new_start:new_end].splitlines()[:3]:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge may change only find, replacement, and description.')
                  repaired = repaired[:start] + candidate[new_start:new_end] + repaired[end:]
              removed = 'sdk-context-captured-aborted-getter'
              if f'"{removed}"' in candidate:
                  raise SystemExit(f'{removed}: the bridge removes only a spec this tree no longer registers.')
              start, end = spec_block(repaired, f'            "{removed}",\n', '        (\n', '        ),\n')
              repaired = repaired[:start] + repaired[end:]
              verdict = f'        "{removed}": ExpectedVerdict(\n'
              if repaired.count(verdict) != 1:
                  raise SystemExit(f'{removed}: the bridge requires exactly one verdict entry.')
              start = repaired.index(verdict)
              end = repaired.index('        ),\n', start) + len('        ),\n')
              repaired = repaired[:start] + repaired[end:]
              cardinality = '        if len(MUTATIONS) != 434:\n'
              if repaired.count(cardinality) != 1:
                  raise SystemExit('the bridge requires the base inventory size assertion.')
              repaired = repaired.replace(cardinality, '        if len(MUTATIONS) != 433:\n')
              exemptions = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(exemptions) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              markers = (
                  'mutation-verdict:behavior:heartbeat-names-cancellation',
                  'mutation-verdict:behavior:sdk-heartbeat-cancellation-outcome',
                  'mutation-verdict:behavior:sdk-reasonless-refusal-is-lease-lost',
                  'mutation-verdict:behavior:task-control-cancellation-error-class',
                  'mutation-verdict:construction:task-control-runtime-cancellation-auth',
              )
              for marker in markers:
                  if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                      raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              repaired = repaired.replace(
                  exemptions,
                  exemptions + ''.join(
                      f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n'
                      for marker in markers
                  ),
              )
          elif digest == '91249d308f3484c0a4367d7d36d23454ad7d84d9ce42f4fcdbe766fbf99041eb':
              # Decoding the activation answer renamed the run the retry decision reads,
              # which re-aimed one find.
              key = '        "sdk-owned-retry-attempt",\n'
              def spec_block(text):
                  if text.count(key) != 1:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge requires exactly one entry.')
                  start = text.rindex('    (\n', 0, text.index(key))
                  end = text.index('    ),\n', start) + len('    ),\n')
                  return start, end
              start, end = spec_block(previous)
              new_start, new_end = spec_block(candidate)
              if previous[start:end].splitlines()[:3] != candidate[new_start:new_end].splitlines()[:3]:
                  raise SystemExit(f'{key.strip()}: the re-aim bridge may change only find, replacement, and description.')
              repaired = previous[:start] + candidate[new_start:new_end] + previous[end:]
          elif digest == '04cf2ece351df1592ed2710c7b12027b63a1f86aaccd500e913cddb95937c083':
              # Building store batches as statement trees re-aimed these finds.
              def spec_block(text, key):
                  if text.count(key) != 1:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge requires exactly one entry.')
                  start = text.rindex('    (\n', 0, text.index(key))
                  end = text.index('    ),\n', start) + len('    ),\n')
                  return start, end
              repaired = previous
              for name in ('complete-terminalization-requires-sole-live-run',):
                  key = f'        "{name}",\n'
                  start, end = spec_block(repaired, key)
                  new_start, new_end = spec_block(candidate, key)
                  if repaired[start:end].splitlines()[:3] != candidate[new_start:new_end].splitlines()[:3]:
                      raise SystemExit(f'{key.strip()}: the re-aim bridge may change only find, replacement, and description.')
                  repaired = repaired[:start] + candidate[new_start:new_end] + repaired[end:]
          else:
              print('Base registry does not need the re-aim bridge.')
              raise SystemExit(0)
          base.write_text(repaired)
          print('Re-aimed registered mutation text; all other base registry bytes are unchanged.')
          PY
      - name: The base branch's checkers, applied to this tree
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          if [ -f /tmp/base/scripts/gate-lint.py ] && grep -q -- '--run-base HEAD BASE' /tmp/base/scripts/gate-lint.py; then
            python3 /tmp/base/scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          else
            python3 scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          fi
