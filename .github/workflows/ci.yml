# Principle: everything runnable locally is runnable here, identically —
# `pnpm verify` is the same gate in both places. As phases land, this file
# grows the same way the local story does: seeded sim-fuzz jobs, MySQL and
# Postgres service containers (Phase 4), and TLC model checking of
# specs/*.tla (PR1.7) — all deterministic, all reproducible from a checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
      # The dialects this job has servers for. MySQL runs the same suite in its
      # own job below, beside this one, so this job stays the length it was.
      DURABLERUN_CONFORMANCE_DIALECTS: libsql,postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The identical conformance suite against MySQL 8, in parallel with `verify`.
  # The server is started by hand because a service container takes no server
  # arguments: the data directory is a tmpfs and the binary log and durable
  # flushes are off, which is what keeps a database for every test affordable.
  conformance-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DURABLERUN_MYSQL_URL: mysql://root:durablerun@127.0.0.1:3306/durablerun
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL 8
        run: |
          docker run -d --name durablerun-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=durablerun -e MYSQL_DATABASE=durablerun \
            --tmpfs /var/lib/mysql:rw,size=4g mysql:8.4 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 --sync-binlog=0 --max-connections=500
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MySQL to accept queries
        run: |
          for attempt in $(seq 1 60); do
            if docker exec durablerun-mysql mysql -h127.0.0.1 -uroot -pdurablerun -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs durablerun-mysql | tail -40
          exit 1
      - run: bash packages/conformance/bin/dialect-conformance.sh mysql

  # The mutation audit runs each mutation's registered test, so a full run fits in
  # a CI job and no one has to run it by hand before merging.
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DURABLERUN_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/durablerun
      # Some registered mutations are killed by tests that need a MySQL server.
      DURABLERUN_MYSQL_URL: mysql://root:durablerun@127.0.0.1:3306/durablerun
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durablerun
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablerun"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MySQL 8 and wait for it to accept queries
        run: |
          docker run -d --name durablerun-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=durablerun -e MYSQL_DATABASE=durablerun \
            --tmpfs /var/lib/mysql:rw,size=4g mysql:8.4 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 --sync-binlog=0 --max-connections=500
          for attempt in $(seq 1 60); do
            if docker exec durablerun-mysql mysql -h127.0.0.1 -uroot -pdurablerun -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs durablerun-mysql | tail -40
          exit 1
      - run: pnpm verify:mutations

  tla:
    runs-on: ubuntu-latest
    # About five minutes when healthy. A hung TLC run must not hold a runner for the six hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Model-check the scheduler protocol (CI scope)
        run: TLA_SCOPE=ci bash scripts/tla.sh

  # The gate cannot be allowed to grade itself.
  #
  # `verify` above runs from the pull request's own checkout, and the list of
  # checks it runs is a string in that same tree's package.json. Deleting
  # `&& pnpm lint:clock` from it is therefore green by construction — the
  # branch under review decides what reviews it. Every checker has the same
  # shape: its rules live in the tree it grades. So this job runs the BASE
  # branch's copies against the pull request's tree.
  #
  # Two limits, both found by this job's own first live run:
  #
  # 1. Older checkers derive their root from __file__ and ignore a supplied
  #    root argument. The runner therefore stages the head tree in a temporary
  #    directory and replaces its scripts/ directory with the base branch's
  #    whole scripts/ directory. Base-owned code then resolves __file__ inside
  #    the head-shaped tree. Its command inventory comes semantically from the
  #    base package.json, includes both Python and shell checks, and must be
  #    nonempty. Once the base owns this runner, its copy executes too; the
  #    head copy is an explicit one-release bootstrap for a base that predates
  #    gate-lint.py.
  # 2. This workflow file comes from the pull request head, like everything
  #    else. The threat model is CLAUDE.md's — "forgot under momentum", not a
  #    determined edit — and against that a copy the branch did not write is
  #    the defence. It is not a sandbox.
  base-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit beside it
        run: git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
      - name: The base gate's composition rules, applied to this tree
        run: |
          set -euo pipefail
          if [ ! -f /tmp/base/scripts/gate-lint.py ]; then
            echo "The base branch predates gate-lint.py, so there is no earlier"
            echo "composition to compare this one against. True only until this merges."
            exit 0
          fi
          python3 /tmp/base/scripts/gate-lint.py "$GITHUB_WORKSPACE" /tmp/base
      - name: Expose installed modules to staged base-owned checkers
        env:
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          mkdir -p "$TMPDIR"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$TMPDIR/node_modules"
      - name: Bridge a new dialect package past its older base checker
        # The head gate above owns an entirely new package. The older ledger
        # cannot classify a dialect that did not exist on its branch. Each
        # becomes a no-op automatically as soon as its PR is the base.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          added_root="$RUNNER_TEMP/durablerun-base-added"
          for package in store-postgres store-mysql; do
            if git ls-tree -r --name-only "$BASE_SHA" -- "packages/$package" | grep -q .; then
              continue
            fi
            mkdir -p "$added_root"
            mv -- "packages/$package" "$added_root/$package"
          done
      - name: Bridge pinned file pairs past their older base copies
        # The base's checkers run against this tree from a staged copy of the base. When
        # a checker or its data must change in the same pull request as the code it
        # reads, the base copy cannot pass, and the reviewed exception is one row here:
        # a path, the sha256 of the base's file, and the sha256 of this tree's file,
        # which is installed over it. A base whose file has another hash skips the row,
        # and so does a tree that leaves the file as the base has it. A tree that
        # changes the file to anything but the pinned head file is refused, so a later
        # edit to that file must re-pin it in the same reviewed change. A row is dead
        # once its pull request is the base, and is deleted then. No row is live today:
        # the last one carried the batch lint that child tasks changed, which main has.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          PAIRS = (
              # (path, sha256 of the base's file, sha256 of this tree's file, why)
          )
          for path, base_hash, head_hash, why in PAIRS:
              base = Path('/tmp/base') / path
              if not base.exists() or hashlib.sha256(base.read_bytes()).hexdigest() != base_hash:
                  print(f'{path}: the base does not need this pair.')
                  continue
              candidate = Path(path).read_bytes()
              if candidate == base.read_bytes():
                  print(f'{path}: this tree leaves the file as the base has it.')
                  continue
              if hashlib.sha256(candidate).hexdigest() != head_hash:
                  raise SystemExit(f'{path}: the pair is pinned to one head file; re-pin it with the change to that file.')
              base.write_bytes(candidate)
              print(f'{path}: installed the pinned head file over the pinned base file ({why}).')
          print(f'{len(PAIRS)} pinned file pairs.')
          PY
      - name: Bridge re-aimed mutation targets in the older base registry
        # A base registry's find strings must occur in this tree, and every verdict
        # marker in this tree's tests must be registered or exempted by it. Some
        # find strings were legitimately re-aimed, and some markers are newer than
        # a base. The one arm is pinned to the base registry's hash and replaces or
        # adds only that data, never checker logic or verdicts. Any other base skips.
        # An arm is dead once its pull request is the base, and the next pull request
        # that needs one replaces it, keeping the helpers.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path('/tmp/base/scripts/mutation-probe.py')
          previous = base.read_text()
          candidate = Path('scripts/mutation-probe.py').read_text()
          digest = hashlib.sha256(previous.encode()).hexdigest()
          def entry(text, name):
              key = f'            "{name}",\n'
              if text.count(key) != 1:
                  raise SystemExit(f'{name}: the re-aim bridge requires exactly one spec entry.')
              start = text.rindex('        (\n', 0, text.index(key))
              end = text.index('        ),\n', start) + len('        ),\n')
              return start, end
          def reaim(repaired, candidate, names):
              # Replace each named top-level entry with this tree's, which may change
              # only its find, replacement, and description.
              for name in names:
                  key = f'        "{name}",\n'
                  blocks = []
                  for text in (repaired, candidate):
                      if text.count(key) != 1:
                          raise SystemExit(f'{name}: the re-aim bridge requires exactly one entry.')
                      start = text.rindex('    (\n', 0, text.index(key))
                      blocks.append((start, text.index('    ),\n', start) + len('    ),\n')))
                  (start, end), (new_start, new_end) = blocks
                  if repaired[start:end].splitlines()[:3] != candidate[new_start:new_end].splitlines()[:3]:
                      raise SystemExit(f'{name}: the re-aim bridge may change only find, replacement, and description.')
                  repaired = repaired[:start] + candidate[new_start:new_end] + repaired[end:]
              return repaired
          def exempt(repaired, candidate, markers):
              # Exempt verdict markers this tree registers and the base registry predates.
              table = 'VERDICT_MARKER_EXEMPTIONS = {\n'
              if repaired.count(table) != 1:
                  raise SystemExit('verdict exemptions: the bridge requires one exemption table.')
              for marker in markers:
                  if f'"{marker}"' in repaired or f'"{marker}"' not in candidate:
                      raise SystemExit(f'{marker}: the bridge exempts only markers this tree registers and the base does not.')
              entries = ''.join(
                  f'    "{marker}": (\n        "registered by the head registry, which the base predates"\n    ),\n'
                  for marker in markers
              )
              return repaired.replace(table, table + entries)
          def reaim_moved(repaired, candidate, names):
              # Replace each named top-level entry with this tree's, which may also change
              # the file it mutates: the condition moved from store text into a shared
              # statement. The name line must still match.
              for name in names:
                  key = f'        "{name}",\n'
                  blocks = []
                  for text in (repaired, candidate):
                      if text.count(key) != 1:
                          raise SystemExit(f'{name}: the re-aim bridge requires exactly one entry.')
                      start = text.rindex('    (\n', 0, text.index(key))
                      blocks.append((start, text.index('    ),\n', start) + len('    ),\n')))
                  (start, end), (new_start, new_end) = blocks
                  if repaired[start:end].splitlines()[:2] != candidate[new_start:new_end].splitlines()[:2]:
                      raise SystemExit(f'{name}: the re-aim bridge may not rename an entry.')
                  repaired = repaired[:start] + candidate[new_start:new_end] + repaired[end:]
              return repaired
          def reaim_table(repaired, candidate, name):
              # Replace one named top-level dict of the registry with this tree's, for
              # a table keyed by mutation name whose keys moved with their mutations.
              opening = f'{name} = {{\n'
              spans = []
              for text in (repaired, candidate):
                  if text.count(opening) != 1:
                      raise SystemExit(f'{name}: the bridge requires exactly one table.')
                  start = text.index(opening)
                  spans.append((start, text.index('\n}\n', start) + len('\n}\n')))
              (start, end), (new_start, new_end) = spans
              return repaired[:start] + candidate[new_start:new_end] + repaired[end:]
          def reaim_consumer(repaired, candidate, name):
              # Replace the tail anchor of one checkpoint conflict consumer pair, which the
              # generated checkpoint conflict mutations of that consumer share.
              table = 'CHECKPOINT_CONFLICT_CONSUMERS = (\n'
              pair = f'        "{name}",\n'
              anchors = []
              for text in (repaired, candidate):
                  if text.count(table) != 1:
                      raise SystemExit('checkpoint conflict consumers: the bridge requires one table.')
                  opened = text.index(table)
                  closed = text.index('\n)\n', opened)
                  if text.count(pair, opened, closed) != 1:
                      raise SystemExit(f'{name}: the bridge requires exactly one consumer pair.')
                  start = text.index(pair, opened, closed) + len(pair)
                  anchors.append((start, text.index('    ),\n', start)))
              (start, end), (new_start, new_end) = anchors
              return repaired[:start] + candidate[new_start:new_end] + repaired[end:]
          def retire(repaired, candidate, names, inventory):
              # Remove each named top-level entry, its verdict, and any one-line row another
              # table keys by its name, for a mutation whose code this tree deleted. The
              # candidate must no longer register the name, and the inventory assertion
              # drops by the number removed.
              for name in names:
                  if f'"{name}"' in candidate:
                      raise SystemExit(f'{name}: the bridge retires only an entry this tree no longer registers.')
                  key = f'        "{name}",\n'
                  if repaired.count(key) != 1:
                      raise SystemExit(f'{name}: the bridge requires exactly one entry.')
                  start = repaired.rindex('    (\n', 0, repaired.index(key))
                  if not repaired.startswith('    (\n' + key, start):
                      raise SystemExit(f'{name}: the bridge retires only a top-level entry.')
                  repaired = repaired[:start] + repaired[repaired.index('    ),\n', start) + len('    ),\n'):]
                  verdict = f'    "{name}": ExpectedVerdict(\n'
                  if repaired.count(verdict) != 1:
                      raise SystemExit(f'{name}: the bridge requires exactly one verdict entry.')
                  start = repaired.index(verdict)
                  repaired = repaired[:start] + repaired[repaired.index('    ),\n', start) + len('    ),\n'):]
                  row = f'    "{name}": '
                  repaired = '\n'.join(
                      line for line in repaired.split('\n') if not (line.startswith(row) and line.endswith(','))
                  )
                  if f'"{name}"' in repaired:
                      raise SystemExit(f'{name}: the base registry still names the retired entry.')
              size = f'        if len(MUTATIONS) != {inventory}:\n'
              if repaired.count(size) != 1:
                  raise SystemExit('the bridge requires the base inventory size assertion.')
              return repaired.replace(size, f'        if len(MUTATIONS) != {inventory - len(names)}:\n')
          def reaim_lines(repaired, name, old, new):
              # Replace literal lines inside one named top-level entry, for an entry a base
              # generator reads in a shape this tree's registry no longer has.
              key = f'        "{name}",\n'
              if repaired.count(key) != 1:
                  raise SystemExit(f'{name}: the re-aim bridge requires exactly one entry.')
              start = repaired.rindex('    (\n', 0, repaired.index(key))
              end = repaired.index('    ),\n', start) + len('    ),\n')
              if repaired[start:end].count(old) != 1:
                  raise SystemExit(f'{name}: the re-aim bridge requires the pinned lines exactly once.')
              return repaired[:start] + repaired[start:end].replace(old, new) + repaired[end:]
          def list_conditions(repaired, candidate, file, lines):
              # List condition lines of a tree rule whose mutations this tree registers and the
              # base predates, so the base's derived coverage check reads them as held.
              table = 'TREE_CONDITIONS_WITHOUT_A_MUTATION: dict[str, dict[str, str]] = {\n'
              opening = f'    "{file}": {{\n'
              if repaired.count(table) != 1 or repaired.count(opening, repaired.index(table)) != 1:
                  raise SystemExit(f'{file}: the bridge requires one listed-conditions section.')
              at = repaired.index(opening, repaired.index(table)) + len(opening)
              for line in lines:
                  if f'"{line}": (' in repaired or line not in candidate:
                      raise SystemExit(f'{line}: the bridge lists only a line this tree mutates and the base does not list.')
              entries = ''.join(
                  f'        "{line}": (\n            "held by mutations the head registry registers, which the base predates"\n        ),\n'
                  for line in lines
              )
              return repaired[:at] + entries + repaired[at:]
          def unlist_conditions(repaired, candidate, file, lines):
              # Drop listed condition lines of a tree rule file that this tree deleted or moved
              # to another file, so the base's derived coverage check does not read them as
              # stale. This tree's registry must no longer list them for that file.
              table = 'TREE_CONDITIONS_WITHOUT_A_MUTATION: dict[str, dict[str, str]] = {\n'
              opening = f'    "{file}": {{\n'
              def section(text):
                  if text.count(table) != 1 or text.count(opening, text.index(table)) != 1:
                      raise SystemExit(f'{file}: the bridge requires one listed-conditions section.')
                  start = text.index(opening, text.index(table)) + len(opening)
                  return start, text.index('\n    },\n', start) + 1
              head_start, head_end = section(candidate)
              for line in lines:
                  key = f'        "{line}": (\n'
                  start, end = section(repaired)
                  if repaired.count(key, start, end) != 1 or key in candidate[head_start:head_end]:
                      raise SystemExit(f'{line}: the bridge unlists only a line the base lists once and this tree no longer lists.')
                  at = repaired.index(key, start, end)
                  repaired = repaired[:at] + repaired[repaired.index('        ),\n', at) + len('        ),\n'):]
              return repaired
          if digest == '841b2d76bb5f4aae00927222cdce6df72f0b6430e8384d481032fe736c5c42ae':
              # The generic reading of a node's children moved from sql-tree.ts to
              # tree-walk.ts, which the base's coverage check does not read, so the
              # lines the base lists for the old reader are unlisted. The rule that holds a
              # statement to one definition of eligibility is new: the head registry
              # registers a mutation for each of its conditions or lists the line with what
              # a sweep showed, the base predates all of them, and so its lines are listed
              # and its verdict markers exempted. No base entry is re-aimed or retired.
              repaired = unlist_conditions(previous, candidate, 'packages/core/src/sql-tree.ts', (
                  "for (const item of value) if (isNode(item)) out.push(item)",
                  "if (Array.isArray(value)) {",
                  "if (ValueNode.is(node)) return []",
                  "return test(node) || children(node).some((child) => someNode(child, test))",
                  "typeof (value as { kind?: unknown }).kind === 'string'",
                  "typeof value === 'object' &&",
                  "value !== null &&",
                  "} else if (isNode(value)) {",
              ))
              repaired = list_conditions(repaired, candidate, 'packages/core/src/sql-tree.ts', (
                  "if (values.length < 2) return null",
                  "if (!values.some((value) => typeof value === 'string' && STATE_NAMES.includes(value))) return null",
                  "const defined = STATE_SETS.some(",
                  "(set) => set.length === values.length && set.every((state) => values.includes(state)),",
                  "if (ValuesNode.is(node)) {",
                  "} else if (rows.includes(node)) {",
                  "} else if (PrimitiveValueListNode.is(node)) {",
                  "} else if (ValueListNode.is(node)) {",
                  "node.values.map((value) => (ValueNode.is(value) ? value.value : undefined)),",
                  "} else if (RawNode.is(node)) {",
                  "BinaryOperationNode.is(node) &&",
                  "ORDERING_OPERATORS.includes(operatorName(node.operator) ?? '')",
                  "const compared = [node.leftOperand, node.rightOperand].some((operand) =>",
                  "someNode(operand, (inner) => columnName(inner) === 'cancel_at_ms'),",
                  "if (compared) {",
                  "return problem !== null",
              ))
              repaired = list_conditions(repaired, candidate, 'packages/core/src/fenced-batch.ts', (
                  "if (second !== null) throw new Error(`${at} holds ${second}`)",
              ))
              repaired = exempt(repaired, candidate, (
                  "mutation-verdict:construction:tree-state-list-built-from-nodes",
                  "mutation-verdict:construction:tree-state-list-of-value-nodes",
                  "mutation-verdict:construction:tree-state-set-live",
                  "mutation-verdict:construction:tree-state-set-queued",
                  "mutation-verdict:construction:tree-state-set-terminal",
                  "mutation-verdict:construction:tree-state-list-one-state",
                  "mutation-verdict:construction:tree-state-list-names-a-state",
                  "mutation-verdict:construction:tree-state-list-length",
                  "mutation-verdict:construction:tree-state-list-members",
                  "mutation-verdict:construction:tree-state-list-skips-insert-rows",
                  "mutation-verdict:construction:tree-state-list-in-a-fragment",
                  "mutation-verdict:construction:tree-state-list-every-list-of-a-fragment",
                  "mutation-verdict:construction:tree-eligibility-first-problem-stands",
                  "mutation-verdict:construction:tree-eligibility-asked-of-every-statement",
                  "mutation-verdict:construction:tree-deadline-operator-less",
                  "mutation-verdict:construction:tree-deadline-operator-less-or-equal",
                  "mutation-verdict:construction:tree-deadline-operator-greater",
                  "mutation-verdict:construction:tree-deadline-operator-greater-or-equal",
                  "mutation-verdict:construction:tree-deadline-either-side",
                  "mutation-verdict:construction:tree-deadline-under-arithmetic",
                  "mutation-verdict:construction:tree-deadline-orders",
                  "mutation-verdict:construction:tree-deadline-names-the-column",
                  "mutation-verdict:construction:tree-walk-reads-below-the-root",
              ))
          else:
              print('Base registry does not need the re-aim bridge.')
              raise SystemExit(0)
          base.write_text(repaired)
          print('Re-aimed registered mutation text; all other base registry bytes are unchanged.')
          PY
      - name: The base branch's checkers, applied to this tree
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          TMPDIR: ${{ runner.temp }}/durablerun-base-gate
        run: |
          if [ -f /tmp/base/scripts/gate-lint.py ] && grep -q -- '--run-base HEAD BASE' /tmp/base/scripts/gate-lint.py; then
            python3 /tmp/base/scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          else
            python3 scripts/gate-lint.py --run-base "$GITHUB_WORKSPACE" /tmp/base
          fi
